name: CICD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
    tags:
      - '*'

jobs:
  package_metadata:
    name: Extract package metadata
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Extract package information
      id: package_metadata
      run: |
        node -p '"name=" + require("./package.json").name' | tee -a $GITHUB_OUTPUT
        node -p '"version=" + require("./package.json").version' | tee -a $GITHUB_OUTPUT
        node -p '"node=" + require("./package.json").engines.node.replace(/^>=/, "")' | tee -a $GITHUB_OUTPUT
    outputs:
      name: ${{ steps.package_metadata.outputs.name }}
      version: ${{ steps.package_metadata.outputs.version }}
      node: ${{ steps.package_metadata.outputs.node }}

  check_syntax:
    name: Check that every module parses
    runs-on: ubuntu-latest
    needs: package_metadata
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ needs.package_metadata.outputs.node }}
    - name: node --check
      shell: bash
      run: find bin src test -name '*.js' -print0 | xargs -0 -n1 node --check

  test:
    name: Node.js ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: package_metadata
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
    - name: Checkout source code
      uses: actions/checkout@v6

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}

    - name: Show version information
      shell: bash
      run: |
        node --version
        npm --version

    - name: Run tests
      run: npm test

    - name: Run the command
      shell: bash
      run: |
        node bin/pastel.js --version
        node bin/pastel.js format hex red
        node bin/pastel.js color 556270 4ecdc4 c7f484 ff6b6b c44d58

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [package_metadata, test]
    steps:
    - name: Checkout source code
      uses: actions/checkout@v6

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ needs.package_metadata.outputs.node }}

    - name: Create package tarball
      id: package
      shell: bash
      run: |
        PKG_NAME="$(npm pack --silent)"
        echo "PKG_NAME=${PKG_NAME}" >> $GITHUB_OUTPUT

    - name: "Artifact upload: package tarball"
      uses: actions/upload-artifact@v6
      with:
        name: ${{ steps.package.outputs.PKG_NAME }}
        path: ${{ steps.package.outputs.PKG_NAME }}

    - name: Check for release
      id: is-release
      shell: bash
      run: |
        unset IS_RELEASE ; if [[ $GITHUB_REF =~ ^refs/tags/v[0-9].* ]]; then IS_RELEASE='true' ; fi
        echo "IS_RELEASE=${IS_RELEASE}" >> $GITHUB_OUTPUT

    - name: Publish package tarball
      uses: softprops/action-gh-release@v2
      if: steps.is-release.outputs.IS_RELEASE
      with:
        files: |
          ${{ steps.package.outputs.PKG_NAME }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
